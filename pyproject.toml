readme = "README.md"
authors = [
    { name = "leonardgst", email = "goussetleonard@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
rubiks = "rubiks:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"
