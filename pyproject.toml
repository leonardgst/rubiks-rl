[project]
name = "rubiks"
version = "0.1.0"
description = "Rubik's Cube 3x3 jouable en 3D, résolu par un agent de reinforcement learning"
readme = "README.md"
authors = [
    { name = "leonardgst", email = "goussetleonard@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "pygame>=2.6.1",
]

[project.scripts]
rubiks = "rubiks:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]          # pytest cherche les tests uniquement dans tests/

[tool.ruff.lint]
select = ["E", "F", "I"]       # E : style, F : erreurs probables, I : ordre des imports
